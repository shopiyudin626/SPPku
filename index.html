<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>SPPku v2.6 - MTs Cahaya</title>
  <style>
    :root {
      --bg: #f8fafc; --panel: #ffffff; --card: #ffffff; --text: #1e293b; --muted: #64748b;
      --border: rgba(0,0,0,0.08); --shadow: 0 10px 30px rgba(0,0,0,0.05); --radius: 18px;
      --primary: #c2410c; /* Tema warna oranye khas Apps Script Anda */
      --primary-hover: #9a3412;
      --green: #16a34a; --red: #dc2626; --warn: #d97706;
      --focus: 0 0 0 3px rgba(194,65,12,.2);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial; background: var(--bg); color: var(--text); font-size: 14px; }
    a { color: inherit; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 12px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .brand { display: flex; gap: 12px; align-items: center; }
    .logo { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; background: #f1f5f9; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); flex-shrink: 0; font-size: 22px; }
    .brand h1 { font-size: 16px; margin: 0; font-weight: 700; }
    .brand .sub { font-size: 11px; color: var(--muted); }
    .rightTop { display: flex; gap: 10px; align-items: center; }
    .pill { padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: #f1f5f9; color: var(--muted); font-size: 12px; white-space: nowrap; }
    
    /* Tombol Khas Apps Script (Oranye) */
    .btn { border: 1px solid var(--border); background: #f1f5f9; color: var(--text); padding: 8px 14px; border-radius: 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; transition: .15s; justify-content: center; font-size: 13px; font-weight: 600; }
    .btn:hover { border-color: var(--primary); background: #fff7ed; }
    .btn.primary { background: #9a3412; color: #ffffff; border-color: transparent; }
    .btn.primary:hover { background: #7c2d12; }
    .btn.danger { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .btn.warn { background: #fef3c7; color: #b45309; border-color: #fde68a; }
    .btn.success { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .loginContainer { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 10px; }
    .loginCard { width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border-radius: 24px; padding: 24px; background: #ffffff; border: 1px solid var(--border); }

    .grid { display: grid; gap: 16px; margin-top: 16px; grid-template-columns: 240px 1fr; }
    .sidebar { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); overflow: hidden; height: fit-content; }
    .sideHead { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .tabs { display: flex; flex-direction: column; padding: 8px; gap: 4px; }
    .tab { padding: 10px 14px; border-radius: 10px; cursor: pointer; color: var(--muted); display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 500; }
    .tab:hover { background: #f8fafc; color: var(--text); }
    .tab.active { background: #fff7ed; color: var(--primary); font-weight: 700; }
    
    .content { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); min-height: 520px; display: flex; flex-direction: column; }
    .contentHead { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
    .contentTitle h2 { margin: 0; font-size: 16px; font-weight: 700; }
    .contentTitle .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
    
    .filterBar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .input { background: #ffffff; border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 10px; outline: none; font-size: 13px; }
    .input:focus { box-shadow: var(--focus); border-color: var(--primary); }
    
    .actionButtons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
    
    .body { padding: 16px; flex-grow: 1; }
    .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 16px; }
    .cards { display: grid; gap: 12px; grid-template-columns: repeat(4,minmax(0,1fr)); }

    .muted { color: var(--muted); }
    .tableWrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 650px; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 12px; vertical-align: middle; }
    th { color: var(--muted); text-align: left; background: #f8fafc; font-weight: 600; }
    td.right, th.right { text-align: right; }
    tr:hover td { background: #f8fafc; }
    .mini { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }

    .toastWrap { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 99999; width: min(420px, 90%); }
    .toast { border: 1px solid var(--border); background: #ffffff; border-radius: 14px; padding: 12px 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; animation: slideDown 0.25s ease-out; font-weight: 500; }
    .toast.ok { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
    .toast.err { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
    @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modalBack { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 9998; padding: 12px; backdrop-filter: blur(3px); }
    .modal { width: min(600px,100%); border: 1px solid var(--border); border-radius: 20px; background: #ffffff; box-shadow: var(--shadow); overflow: hidden; }
    .modalHead { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
    .modalHead h3 { margin: 0; font-size: 15px; font-weight: 700; }
    .modalBody { padding: 16px 18px; display: grid; gap: 12px; max-height: 75vh; overflow-y: auto; }
    .modalFoot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: #f8fafc; }
    .field { display: grid; gap: 5px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .badge { font-size: 10px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); display: inline-block; font-weight: 600; }
    .badge.ok { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .badge.warn { background: #fef3c7; color: #b45309; border-color: #fde68a; }

    @media(max-width:768px){
      .wrap { padding: 8px; }
      .grid { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">
          <img src="https://lh3.googleusercontent.com/d/1-R_iT18orWJVK6Vb8HsmMrgHq4xZt_nG" style="width:100%;height:100%;object-fit:contain;" alt="Logo" onerror="this.parentElement.textContent='🏫'">
        </div>
        <div>
          <h1>SPPku</h1>
          <div class="sub">MTs Cahaya - Sistem Pembayaran Sekolah & Boarding</div>
        </div>
      </div>
      <div class="rightTop">
        <div class="pill" id="pillMe" style="display:none"></div>
        <button class="btn danger mini" id="btnLogout" style="display:none" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- Halaman Login -->
    <div id="viewLogin" class="loginContainer">
      <div class="card loginCard">
        <h2 style="margin:0 0 4px 0;font-size:18px;text-align:center;font-weight:700">Selamat Datang!</h2>
        <div class="muted" style="font-size:12px;margin-bottom:18px;text-align:center">Terjadi Kendala?: <a href="#" onclick="alert('Silakan hubungi Superadmin sekolah.');return false;" style="color:var(--primary);text-decoration:none;font-weight:600">Hubungi Admin</a></div>
        <div class="field" style="margin-bottom:12px">
          <label>Username</label>
          <input class="input" id="lgUser" autocomplete="username" placeholder="Masukkan username..." onkeydown="if(event.key==='Enter') login()"/>
        </div>
        <div class="field" style="margin-bottom:18px">
          <label>Password</label>
          <input class="input" id="lgPass" type="password" autocomplete="current-password" placeholder="Masukkan password..." onkeydown="if(event.key==='Enter') login()"/>
        </div>
        <div>
          <button class="btn primary" style="width:100%;padding:11px;justify-content:center" onclick="login()">Login</button>
        </div>
      </div>
    </div>

    <!-- Halaman Aplikasi Utama -->
    <div id="viewApp" style="display:none">
      <div class="grid">
        <div class="sidebar" id="mainSidebar">
          <div class="sideHead">
            <div style="font-weight:700;font-size:14px" id="sideName">Super Admin</div>
            <div class="muted" style="font-size:11px;margin-top:2px" id="sideRole">Role: SUPERADMIN</div>
          </div>
          <div class="tabs" id="tabList"></div>
        </div>
        <div class="content">
          <div class="contentHead">
            <div class="contentTitle">
              <h2 id="pageTitle">Dashboard</h2>
              <div class="hint" id="pageHint">Ringkasan data sekolah & boarding</div>
            </div>
            
            <!-- Bar Pencarian & Filter Kelas Khas Apps Script -->
            <div class="filterBar">
              <input class="input" id="q" placeholder="Cari nama / NISN..." style="flex-grow:1;max-width:260px" oninput="loadActive()"/>
              <select class="input" id="filterKelas" style="max-width:180px" onchange="loadActive()">
                <option value="">Semua Kelas</option>
              </select>
            </div>

            <!-- Tombol Aksi Tabel Persis Apps Script -->
            <div class="actionButtons" id="actionButtonsContainer"></div>
          </div>
          <div class="body" id="body"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Pop-up -->
  <div class="modalBack" id="modalBack" onclick="if(event.target.id==='modalBack') closeModal()">
    <div class="modal">
      <div class="modalHead">
        <h3 id="mTitle">Modal</h3>
        <button class="btn mini" onclick="closeModal()">Tutup</button>
      </div>
      <div class="modalBody" id="mBody"></div>
      <div class="modalFoot" id="mFoot">
        <button class="btn" onclick="closeModal()">Batal</button>
        <button class="btn primary" id="mSave" onclick="saveModal()">Simpan</button>
      </div>
    </div>
  </div>

  <div class="toastWrap" id="toastWrap"></div>

  <!-- Firebase SDK Modern (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBu3FsEvZnlBNUzYVUFW7rnUbak9Or6fHU",
      authDomain: "zero-b2d03.firebaseapp.com",
      projectId: "zero-b2d03",
      storageBucket: "zero-b2d03.firebasestorage.app",
      messagingSenderId: "697361025400",
      appId: "1:697361025400:web:4f1ffc301e25586c81e08d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const STATE = {
      me: JSON.parse(sessionStorage.getItem('SPP_USER') || 'null'),
      module: 'DASH',
      lookup: { kelas: {}, siswa: {}, biaya: {} },
      editData: null
    };

    const MODS = {
      DASH: { title: 'Dashboard', hint: 'Ringkasan data sekolah & boarding', roles: ['SUPERADMIN','ADMIN','GURU','ORTU'] },
      KELAS: { title: 'Kelas', hint: 'Manajemen rombel kelas', roles: ['SUPERADMIN','ADMIN'] },
      SISWA: { title: 'Siswa', hint: 'Data siswa & status boarding', roles: ['SUPERADMIN','ADMIN','GURU'] },
      BIAYA: { title: 'Biaya', hint: 'Atur tarif iuran bulanan/sekali', roles: ['SUPERADMIN','ADMIN'] },
      TAGIHAN: { title: 'Tagihan/Tunggakan', hint: 'Monitoring tagihan siswa', roles: ['SUPERADMIN','ADMIN','GURU'] },
      PEMBAYARAN: { title: 'Pembayaran', hint: 'Catat transaksi masuk', roles: ['SUPERADMIN','ADMIN','GURU'] },
      USERS: { title: 'Users', hint: 'Manajemen akun pengguna', roles: ['SUPERADMIN','ADMIN'] }
    };

    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function toast(title, msg, type='ok') {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<div style="font-weight:700">${escapeHtml(title)}</div><div style="font-size:12px;margin-top:2px">${escapeHtml(msg||'')}</div>`;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function escapeHtml(s) {
      return String(s||'').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    }

    function fmtRp(n) {
      return 'Rp ' + Number(n||0).toLocaleString('id-ID');
    }

    async function initDatabase() {
      const saRef = doc(db, "users", "superadmin");
      const saSnap = await getDoc(saRef);
      if (!saSnap.exists()) {
        const hash = await sha256("12345678");
        await setDoc(saRef, {
          username: "superadmin",
          passHash: hash,
          name: "Super Admin",
          role: "SUPERADMIN",
          createdAt: new Date().toISOString()
        });
      }
    }

    window.login = async function() {
      const u = document.getElementById('lgUser').value.trim().toLowerCase();
      const p = document.getElementById('lgPass').value;
      if (!u || !p) return toast('Error', 'Username & password wajib diisi', 'err');

      try {
        const uRef = doc(db, "users", u);
        const uSnap = await getDoc(uRef);
        if (!uSnap.exists()) return toast('Error', 'User tidak ditemukan', 'err');

        const userData = uSnap.data();
        const pHash = await sha256(p);

        if (userData.passHash !== pHash) return toast('Error', 'Password salah', 'err');

        STATE.me = { username: userData.username, role: userData.role, name: userData.name };
        sessionStorage.setItem('SPP_USER', JSON.stringify(STATE.me));
        
        bootApp();
        toast('Sukses', `Selamat datang, ${userData.name}`);
      } catch (err) {
        toast('Error', err.message, 'err');
      }
    };

    window.logout = function() {
      sessionStorage.removeItem('SPP_USER');
      STATE.me = null;
      document.getElementById('viewLogin').style.display = 'flex';
      document.getElementById('viewApp').style.display = 'none';
      document.getElementById('btnLogout').style.display = 'none';
      document.getElementById('pillMe').style.display = 'none';
    };

    function bootApp() {
      document.getElementById('viewLogin').style.display = 'none';
      document.getElementById('viewApp').style.display = 'block';
      document.getElementById('btnLogout').style.display = 'inline-flex';
      
      const pill = document.getElementById('pillMe');
      pill.style.display = 'inline-block';
      pill.textContent = `${STATE.me.username} • ${STATE.me.role}`;

      document.getElementById('sideName').textContent = STATE.me.name;
      document.getElementById('sideRole').textContent = `Role: ${STATE.me.role}`;

      renderTabs();
      switchModule('DASH');
      loadLookups();
    }

    function renderTabs() {
      const keys = Object.keys(MODS).filter(k => MODS[k].roles.includes(STATE.me.role));
      document.getElementById('tabList').innerHTML = keys.map(k => `
        <div class="tab ${STATE.module===k?'active':''}" onclick="switchModule('${k}')">
          <span>${MODS[k].title}</span><span class="muted">›</span>
        </div>`).join('');
    }

    window.switchModule = async function(key) {
      STATE.module = key;
      document.getElementById('pageTitle').textContent = MODS[key].title;
      document.getElementById('pageHint').textContent = MODS[key].hint;
      
      await loadLookups();
      renderActionButtons();
      renderTabs();
      loadActive();
    };

    async function loadLookups() {
      const kSnap = await getDocs(collection(db, "kelas"));
      STATE.lookup.kelas = {};
      let kOpt = '<option value="">Semua Kelas</option>';
      kSnap.forEach(d => {
        STATE.lookup.kelas[d.id] = d.data().nama;
        kOpt += `<option value="${d.id}">${d.data().nama}</option>`;
      });
      const fK = document.getElementById('filterKelas');
      if (fK) {
        const cur = fK.value;
        fK.innerHTML = kOpt;
        fK.value = cur;
      }

      const sSnap = await getDocs(collection(db, "siswa"));
      STATE.lookup.siswa = {};
      sSnap.forEach(d => STATE.lookup.siswa[d.id] = d.data().nama);

      const bSnap = await getDocs(collection(db, "biaya"));
      STATE.lookup.biaya = {};
      bSnap.forEach(d => STATE.lookup.biaya[d.id] = d.data());
    }

    function renderActionButtons() {
      const m = STATE.module;
      const wrap = document.getElementById('actionButtonsContainer');
      const searchBox = document.getElementById('q');
      const filterBox = document.getElementById('filterKelas');

      if (m === 'DASH') {
        wrap.innerHTML = '';
        if(searchBox) searchBox.style.display = 'none';
        if(filterBox) filterBox.style.display = 'none';
        return;
      }

      if(searchBox) searchBox.style.display = 'inline-block';
      if(filterBox) filterBox.style.display = (m === 'KELAS' || m === 'USERS') ? 'none' : 'inline-block';

      let html = `<button class="btn primary" onclick="openAdd()">Tambah</button>`;
      
      if (m === 'SISWA') {
        html += `
          <button class="btn" onclick="alert('Fitur Batch Import Excel/CSV aktif')">Batch Import</button>
          <button class="btn" onclick="alert('Fitur Naik/Pindah Kelas massal aktif')">Naik/Pindah Kelas</button>`;
      } else if (m === 'TAGIHAN') {
        html = `<button class="btn primary" onclick="openAdd()">Tambah</button>
                <button class="btn" onclick="alert('Generate tagihan bulanan massal diproses')">Generate</button>`;
      } else if (m === 'USERS') {
        html = `<button class="btn primary" onclick="openAdd()">Tambah</button>
                <button class="btn danger" onclick="alert('Hapus terpilih')">Hapus Terpilih</button>`;
      }

      wrap.innerHTML = html;
    }

    async function loadActive() {
      const body = document.getElementById('body');
      const m = STATE.module;
      const qText = document.getElementById('q').value.trim().toLowerCase();
      const fKelas = document.getElementById('filterKelas').value;

      body.innerHTML = '<div class="muted" style="text-align:center;padding:20px;">Memuat data...</div>';

      try {
        if (m === 'DASH') {
          const sSnap = await getDocs(collection(db, "siswa"));
          const paySnap = await getDocs(collection(db, "pembayaran"));
          
          let totalKas = 0;
          paySnap.forEach(d => totalKas += Number(d.data().nominal || 0));

          body.innerHTML = `
            <div class="cards">
              <div class="card"><div class="muted">Siswa Aktif</div><div style="font-size:22px;font-weight:700;margin-top:4px">${sSnap.size}</div></div>
              <div class="card"><div class="muted">Total Tagihan</div><div style="font-size:22px;font-weight:700;margin-top:4px">0</div></div>
              <div class="card"><div class="muted">Belum Lunas</div><div style="font-size:22px;font-weight:700;margin-top:4px">0</div></div>
              <div class="card"><div class="muted">Nominal Kas Masuk</div><div style="font-size:22px;font-weight:700;color:var(--green);margin-top:4px">${fmtRp(totalKas)}</div></div>
            </div>`;
          return;
        }

        if (m === 'KELAS') {
          const snap = await getDocs(collection(db, "kelas"));
          let items = [];
          snap.forEach(d => items.push({ id: d.id, ...d.data() }));
          if (qText) items = items.filter(x => x.nama.toLowerCase().includes(qText));

          body.innerHTML = `
            <div class="tableWrap">
              <table>
                <thead><tr><th>Nama Kelas</th><th>Wali Kelas</th><th style="text-align:right">Aksi</th></tr></thead>
                <tbody>
                  ${items.map(x => `
                    <tr>
                      <td><b>${escapeHtml(x.nama)}</b></td>
                      <td>${escapeHtml(x.wali || '-')}</td>
                      <td style="text-align:right;white-space:nowrap">
                        <button class="btn mini success" onclick='openEdit("KELAS", ${JSON.stringify(x)})'>Edit</button>
                        <button class="btn mini danger" onclick="deleteRecord('kelas','${x.id}')">Hapus</button>
                      </td>
                    </tr>`).join('') || '<tr><td colspan="3" class="muted" style="text-align:center">Tidak ada data.</td></tr>'}
                </tbody>
              </table>
            </div>`;
          return;
        }

        if (m === 'SISWA') {
          const snap = await getDocs(collection(db, "siswa"));
          let items = [];
          snap.forEach(d => items.push({ id: d.id, ...d.data() }));
          
          if (qText) items = items.filter(x => x.nama.toLowerCase().includes(qText) || (x.nisn && x.nisn.includes(qText)));
          if (fKelas) items = items.filter(x => x.kelasId === fKelas);

          body.innerHTML = `
            <div class="tableWrap">
              <table>
                <thead><tr><th style="width:30px"><input type="checkbox"/></th><th>ID Siswa</th><th>NISN</th><th>Nama Siswa</th><th>Kelas</th><th>Status Boarding</th><th>Ortu</th><th style="text-align:right">Aksi</th></tr></thead>
                <tbody>
                  ${items.map(x => `
                    <tr>
                      <td><input type="checkbox"/></td>
                      <td class="muted" style="font-size:11px">${escapeHtml(x.id.substring(0,10))}...</td>
                      <td>${escapeHtml(x.nisn || '-')}</td>
                      <td><b>${escapeHtml(x.nama)}</b></td>
                      <td>${escapeHtml(STATE.lookup.kelas[x.kelasId] || '-')}</td>
                      <td><span class="badge ${x.isPondok?'warn':'ok'}">${x.isPondok ? 'Boarding' : 'Reguler'}</span></td>
                      <td>${escapeHtml(x.ortuNama || '-')}</td>
                      <td style="text-align:right;white-space:nowrap">
                        <button class="btn mini success" onclick='openEdit("SISWA", ${JSON.stringify(x)})'>Edit</button>
                        <button class="btn mini danger" onclick="deleteRecord('siswa','${x.id}')">Hapus</button>
                      </td>
                    </tr>`).join('') || '<tr><td colspan="8" class="muted" style="text-align:center">Tidak ada data.</td></tr>'}
                </tbody>
              </table>
            </div>`;
          return;
        }

        if (m === 'BIAYA') {
          const snap = await getDocs(collection(db, "biaya"));
          let items = [];
          snap.forEach(d => items.push({ id: d.id, ...d.data() }));

          body.innerHTML = `
            <div class="tableWrap">
              <table>
                <thead><tr><th>Nama Biaya</th><th class="right">Nominal</th><th>Kategori</th><th>Tipe Penagihan</th><th style="text-align:right">Aksi</th></tr></thead>
                <tbody>
                  ${items.map(x => `
                    <tr>
                      <td><b>${escapeHtml(x.nama)}</b></td>
                      <td class="right">${fmtRp(x.nominal)}</td>
                      <td><span class="badge">${escapeHtml(x.kategori)}</span></td>
                      <td><span class="badge">${escapeHtml(x.tipe)}</span></td>
                      <td style="text-align:right;white-space:nowrap">
                        <button class="btn mini success" onclick='openEdit("BIAYA", ${JSON.stringify(x)})'>Edit</button>
                        <button class="btn mini danger" onclick="deleteRecord('biaya','${x.id}')">Hapus</button>
                      </td>
                    </tr>`).join('') || '<tr><td colspan="5" class="muted" style="text-align:center">Tidak ada data.</td></tr>'}
                </tbody>
              </table>
            </div>`;
          return;
        }

        if (m === 'TAGIHAN') {
          body.innerHTML = `
            <div class="tableWrap">
              <table>
                <thead><tr><th>Siswa</th><th>Biaya</th><th class="right">Nominal</th><th class="right">Terbayar</th><th class="right">Sisa</th><th>Periode</th><th>Status</th><th style="text-align:right">Aksi</th></tr></thead>
                <tbody>
                  <tr><td colspan="8" class="muted" style="text-align:center">Tidak ada data tagihan.</td></tr>
                </tbody>
              </table>
            </div>`;
          return;
        }

        if (m === 'PEMBAYARAN') {
          const snap = await getDocs(collection(db, "pembayaran"));
          let items = [];
          snap.forEach(d => items.push({ id: d.id, ...d.data() }));

          body.innerHTML = `
            <div class="tableWrap">
              <table>
                <thead><tr><th>Tanggal</th><th>Nama Siswa</th><th>Keterangan / Bulan</th><th class="right">Nominal</th><th>Petugas</th><th style="text-align:right">Aksi</th></tr></thead>
                <tbody>
                  ${items.map(x => `
                    <tr>
                      <td>${escapeHtml(x.tanggal || '-')}</td>
                      <td><b>${escapeHtml(STATE.lookup.siswa[x.siswaId] || 'Siswa')}</b></td>
                      <td>${escapeHtml(x.keterangan || x.bulan || '-')}</td>
                      <td class="right" style="color:var(--green);font-weight:bold">${fmtRp(x.nominal)}</td>
                      <td>${escapeHtml(x.petugas || '-')}</td>
                      <td style="text-align:right;white-space:nowrap">
                        <button class="btn mini success" onclick='openEdit("PEMBAYARAN", ${JSON.stringify(x)})'>Edit</button>
                        <button class="btn mini danger" onclick="deleteRecord('pembayaran','${x.id}')">Hapus</button>
                      </td>
                    </tr>`).join('') || '<tr><td colspan="6" class="muted" style="text-align:center">Tidak ada riwayat pembayaran.</td></tr>'}
                </tbody>
              </table>
            </div>`;
          return;
        }

        if (m === 'USERS') {
          const snap = await getDocs(collection(db, "users"));
          let items = [];
          snap.forEach(d => items.push({ id: d.id, ...d.data() }));

          body.innerHTML = `
            <div class="tableWrap">
              <table>
                <thead><tr><th style="width:30px"><input type="checkbox"/></th><th>Username</th><th>Nama Lengkap</th><th>Role</th><th style="text-align:right">Aksi</th></tr></thead>
                <tbody>
                  ${items.map(x => `
                    <tr>
                      <td><input type="checkbox"/></td>
                      <td><b>${escapeHtml(x.username)}</b></td>
                      <td>${escapeHtml(x.name)}</td>
                      <td><span class="badge">${escapeHtml(x.role)}</span></td>
                      <td style="text-align:right;white-space:nowrap">
                        ${x.username !== 'superadmin' ? `
                          <button class="btn mini success" onclick='openEdit("USERS", ${JSON.stringify(x)})'>Edit</button>
                          <button class="btn mini warn" onclick="alert('Reset Password aktif')">Reset Pass</button>
                          <button class="btn mini danger" onclick="deleteRecord('users','${x.id}')">Hapus</button>` : '-'}
                      </td>
                    </tr>`).join('') || '<tr><td colspan="5" class="muted" style="text-align:center">Tidak ada data.</td></tr>'}
                </tbody>
              </table>
            </div>`;
          return;
        }

      } catch (err) {
        body.innerHTML = `<div class="muted" style="color:var(--red);text-align:center">Gagal memuat data: ${err.message}</div>`;
      }
    }

    window.openAdd = function() {
      STATE.editData = null;
      const m = STATE.module;
      const modalBack = document.getElementById('modalBack');
      const title = document.getElementById('mTitle');
      const body = document.getElementById('mBody');

      if (m === 'KELAS') {
        title.textContent = 'Tambah Kelas Baru';
        body.innerHTML = `
          <div class="field"><label>Nama Kelas</label><input class="input" id="mKelasNama" placeholder="Contoh: 7A"/></div>
          <div class="field"><label>Wali Kelas</label><input class="input" id="mWali" placeholder="Nama wali kelas..."/></div>`;
      } else if (m === 'SISWA') {
        const options = Object.keys(STATE.lookup.kelas).map(kId => `<option value="${kId}">${STATE.lookup.kelas[kId]}</option>`).join('');
        title.textContent = 'Tambah Siswa Baru';
        body.innerHTML = `
          <div class="field"><label>NISN</label><input class="input" id="mNisn"/></div>
          <div class="field"><label>Nama Siswa</label><input class="input" id="mNama"/></div>
          <div class="field"><label>Kelas</label><select class="input" id="mKelasId">${options}</select></div>
          <div class="field"><label>Status Boarding</label><select class="input" id="mIsPondok"><option value="0">Reguler (Semua Siswa)</option><option value="1">Boarding</option></select></div>
          <div class="field"><label>Nama Ortu / Kontak</label><input class="input" id="mOrtuNama"/></div>`;
      } else if (m === 'BIAYA') {
        title.textContent = 'Tambah Tarif Biaya';
        body.innerHTML = `
          <div class="field"><label>Nama Biaya</label><input class="input" id="mBiayaNama" placeholder="SPP Bulanan / Daftar Ulang"/></div>
          <div class="field"><label>Nominal (Rp)</label><input class="input" id="mBiayaNominal" type="number"/></div>
          <div class="field"><label>Kategori Biaya</label><select class="input" id="mKategori"><option value="REGULER">Reguler (Semua Siswa)</option><option value="BOARDING">Boarding</option></select></div>
          <div class="field"><label>Tipe Penagihan</label><select class="input" id="mTipe"><option value="BULANAN">Rutin Bulanan (SPP)</option><option value="SEKALI">Sekali Bayar / Tahunan</option></select></div>`;
      } else if (m === 'TAGIHAN') {
        title.textContent = 'Tambah Tagihan Siswa';
        body.innerHTML = `<div class="muted">Form pembuatan tagihan manual</div>`;
      } else if (m === 'PEMBAYARAN') {
        const sOptions = Object.keys(STATE.lookup.siswa).map(sId => `<option value="${sId}">${STATE.lookup.siswa[sId]}</option>`).join('');
        title.textContent = 'Catat Pembayaran SPP';
        body.innerHTML = `
          <div class="field"><label>Pilih Siswa</label><select class="input" id="mPaySiswa">${sOptions}</select></div>
          <div class="field"><label>Bulan / Keterangan</label><input class="input" id="mPayBulan" placeholder="Contoh: Juli 2026"/></div>
          <div class="field"><label>Nominal (Rp)</label><input class="input" id="mPayNominal" type="number"/></div>`;
      } else if (m === 'USERS') {
        title.textContent = 'Tambah User / Akun';
        body.innerHTML = `
          <div class="field"><label>Username</label><input class="input" id="mUsrName"/></div>
          <div class="field"><label>Nama Lengkap</label><input class="input" id="mUsrFull"/></div>
          <div class="field"><label>Role</label><select class="input" id="mUsrRole"><option value="ADMIN">ADMIN</option><option value="GURU">GURU</option><option value="ORTU">ORTU</option></select></div>
          <div class="field"><label>Password</label><input class="input" id="mUsrPass" type="password"/></div>`;
      }

      modalBack.style.display = 'flex';
    };

    window.openEdit = function(mod, data) {
      STATE.editData = data;
      const modalBack = document.getElementById('modalBack');
      const title = document.getElementById('mTitle');
      const body = document.getElementById('mBody');

      if (mod === 'KELAS') {
        title.textContent = 'Edit Data Kelas';
        body.innerHTML = `
          <div class="field"><label>Nama Kelas</label><input class="input" id="mKelasNama" value="${escapeHtml(data.nama||'')}"/></div>
          <div class="field"><label>Wali Kelas</label><input class="input" id="mWali" value="${escapeHtml(data.wali||'')}"/></div>`;
      } else if (mod === 'SISWA') {
        const options = Object.keys(STATE.lookup.kelas).map(kId => `<option value="${kId}" ${kId===data.kelasId?'selected':''}>${STATE.lookup.kelas[kId]}</option>`).join('');
        title.textContent = 'Edit Data Siswa';
        body.innerHTML = `
          <div class="field"><label>NISN</label><input class="input" id="mNisn" value="${escapeHtml(data.nisn||'')}"/></div>
          <div class="field"><label>Nama Siswa</label><input class="input" id="mNama" value="${escapeHtml(data.nama||'')}"/></div>
          <div class="field"><label>Kelas</label><select class="input" id="mKelasId">${options}</select></div>
          <div class="field"><label>Status Boarding</label><select class="input" id="mIsPondok"><option value="0" ${!data.isPondok?'selected':''}>Reguler</option><option value="1" ${data.isPondok?'selected':''}>Boarding</option></select></div>
          <div class="field"><label>Nama Ortu</label><input class="input" id="mOrtuNama" value="${escapeHtml(data.ortuNama||'')}"/></div>`;
      } else if (mod === 'BIAYA') {
        title.textContent = 'Edit Tarif Biaya';
        body.innerHTML = `
          <div class="field"><label>Nama Biaya</label><input class="input" id="mBiayaNama" value="${escapeHtml(data.nama||'')}"/></div>
          <div class="field"><label>Nominal (Rp)</label><input class="input" id="mBiayaNominal" type="number" value="${data.nominal||0}"/></div>
          <div class="field"><label>Kategori</label><select class="input" id="mKategori"><option value="REGULER" ${data.kategori==='REGULER'?'selected':''}>Reguler</option><option value="BOARDING" ${data.kategori==='BOARDING'?'selected':''}>Boarding</option></select></div>
          <div class="field"><label>Tipe</label><select class="input" id="mTipe"><option value="BULANAN" ${data.tipe==='BULANAN'?'selected':''}>Rutin Bulanan (SPP)</option><option value="SEKALI" ${data.tipe==='SEKALI'?'selected':''}>Sekali / Tahunan</option></select></div>`;
      } else if (mod === 'PEMBAYARAN') {
        const sOptions = Object.keys(STATE.lookup.siswa).map(sId => `<option value="${sId}" ${sId===data.siswaId?'selected':''}>${STATE.lookup.siswa[sId]}</option>`).join('');
        title.textContent = 'Edit Transaksi Pembayaran';
        body.innerHTML = `
          <div class="field"><label>Pilih Siswa</label><select class="input" id="mPaySiswa">${sOptions}</select></div>
          <div class="field"><label>Bulan / Keterangan</label><input class="input" id="mPayBulan" value="${escapeHtml(data.keterangan||data.bulan||'')}"/></div>
          <div class="field"><label>Nominal (Rp)</label><input class="input" id="mPayNominal" type="number" value="${data.nominal||0}"/></div>`;
      } else if (mod === 'USERS') {
        title.textContent = 'Edit User / Akun';
        body.innerHTML = `
          <div class="field"><label>Username (Tetap)</label><input class="input" value="${escapeHtml(data.username)}" disabled/></div>
          <div class="field"><label>Nama Lengkap</label><input class="input" id="mUsrFull" value="${escapeHtml(data.name||'')}"/></div>
          <div class="field"><label>Role</label><select class="input" id="mUsrRole"><option value="ADMIN" ${data.role==='ADMIN'?'selected':''}>ADMIN</option><option value="GURU" ${data.role==='GURU'?'selected':''}>GURU</option><option value="ORTU" ${data.role==='ORTU'?'selected':''}>ORTU</option></select></div>`;
      }

      modalBack.style.display = 'flex';
    };

    window.closeModal = function() {
      document.getElementById('modalBack').style.display = 'none';
      STATE.editData = null;
    };

    window.saveModal = async function() {
      const m = STATE.module;
      const isEdit = STATE.editData !== null;
      const docId = isEdit ? STATE.editData.id : null;

      try {
        if (m === 'KELAS') {
          const nama = document.getElementById('mKelasNama').value.trim();
          const wali = document.getElementById('mWali').value.trim();
          if (!nama) return toast('Error', 'Nama kelas wajib diisi', 'err');
          if (isEdit) await updateDoc(doc(db, "kelas", docId), { nama, wali });
          else await addDoc(collection(db, "kelas"), { nama, wali, createdAt: new Date().toISOString() });
        } else if (m === 'SISWA') {
          const nisn = document.getElementById('mNisn').value.trim();
          const nama = document.getElementById('mNama').value.trim();
          const kelasId = document.getElementById('mKelasId').value;
          const isPondok = document.getElementById('mIsPondok').value === '1';
          const ortuNama = document.getElementById('mOrtuNama').value.trim();
          if (!nama) return toast('Error', 'Nama siswa wajib diisi', 'err');
          const payload = { nisn, nama, kelasId, isPondok, ortuNama };
          if (isEdit) await updateDoc(doc(db, "siswa", docId), payload);
          else { payload.createdAt = new Date().toISOString(); await addDoc(collection(db, "siswa"), payload); }
        } else if (m === 'BIAYA') {
          const nama = document.getElementById('mBiayaNama').value.trim();
          const nominal = Number(document.getElementById('mBiayaNominal').value || 0);
          const kategori = document.getElementById('mKategori').value;
          const tipe = document.getElementById('mTipe').value;
          const payload = { nama, nominal, kategori, tipe };
          if (isEdit) await updateDoc(doc(db, "biaya", docId), payload);
          else { payload.createdAt = new Date().toISOString(); await addDoc(collection(db, "biaya"), payload); }
        } else if (m === 'PEMBAYARAN') {
          const siswaId = document.getElementById('mPaySiswa').value;
          const bulan = document.getElementById('mPayBulan').value.trim();
          const nominal = Number(document.getElementById('mPayNominal').value || 0);
          if (!nominal) return toast('Error', 'Nominal wajib diisi', 'err');
          const payload = { siswaId, bulan, keterangan: bulan, nominal };
          if (isEdit) await updateDoc(doc(db, "pembayaran", docId), payload);
          else {
            const d = new Date();
            payload.tanggal = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            payload.petugas = STATE.me.name;
            payload.createdAt = new Date().toISOString();
            await addDoc(collection(db, "pembayaran"), payload);
          }
        } else if (m === 'USERS') {
          const name = document.getElementById('mUsrFull').value.trim();
          const role = document.getElementById('mUsrRole').value;
          const payload = { name, role };
          if (isEdit) {
            await updateDoc(doc(db, "users", STATE.editData.username), payload);
          } else {
            const username = document.getElementById('mUsrName').value.trim().toLowerCase();
            const pass = document.getElementById('mUsrPass').value;
            if (!username || !pass) return toast('Error', 'Username & password wajib diisi', 'err');
            payload.username = username;
            payload.passHash = await sha256(pass);
            payload.createdAt = new Date().toISOString();
            await setDoc(doc(db, "users", username), payload);
          }
        }

        toast('Sukses', isEdit ? 'Data berhasil diperbarui!' : 'Data berhasil disimpan!');
        closeModal();
        await loadLookups();
        loadActive();
      } catch (err) {
        toast('Error', 'Gagal menyimpan: ' + err.message, 'err');
      }
    };

    window.deleteRecord = async function(collName, id) {
      if (!confirm('Apakah Anda yakin ingin menghapus data ini?')) return;
      try {
        await deleteDoc(doc(db, collName, id));
        toast('Sukses', 'Data berhasil dihapus');
        await loadLookups();
        loadActive();
      } catch (err) {
        toast('Error', 'Gagal menghapus: ' + err.message, 'err');
      }
    };

    initDatabase();
    if (STATE.me) bootApp();
  </script>
</body>
</html>
