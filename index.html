<html lang="id">
<head>
  <meta charset="utf-8">

  <title>SPPku - Sistem Pembayaran Sekolah & Boarding</title>
  <!-- Firebase SDK v10 Modular -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, getDoc, addDoc, updateDoc, deleteDoc, doc, setDoc, query, where, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Pastikan Menggunakan Konfigurasi Firebase Proyek Anda
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBu3FsEvZnlBNUzYVUFW7rnUbak9Or6fHU",
  authDomain: "zero-b2d03.firebaseapp.com",
  projectId: "zero-b2d03",
  storageBucket: "zero-b2d03.firebasestorage.app",
  messagingSenderId: "697361025400",
  appId: "1:697361025400:web:4f1ffc301e25586c81e08d",
  measurementId: "G-51ZNSWN3XR"
};
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.fbLibs = { collection, getDocs, getDoc, addDoc, updateDoc, deleteDoc, doc, setDoc, query, where, orderBy, writeBatch };
    
    if(window.initAppAfterFirebase) window.initAppAfterFirebase();
  </script>
  <style>
    :root{
      --bg:#f8fafc; --panel:#ffffff; --card:#ffffff; --text:#1e293b; --muted:#64748b;
      --border:rgba(0,0,0,0.08); --shadow:0 10px 30px rgba(0,0,0,0.05); --radius:16px;
      --primary:#0284c7; --green:#16a34a; --red:#dc2626; --warn:#d97706;
      --focus: 0 0 0 3px rgba(2,132,199,.2);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);font-size:14px}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1200px;margin:0 auto;padding:12px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:38px;height:38px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);font-size:18px;overflow:hidden;padding:0}
    .logo img{width:100%;height:100%;object-fit:cover}
    .brand h1{font-size:16px;margin:0;font-weight:700}
    .brand .sub{font-size:11px;color:var(--muted)}
    .rightTop{display:flex;gap:8px;align-items:center}
    .pill{padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:#f1f5f9;color:var(--muted);font-size:11px;font-weight:600}
    .btn{border:1px solid var(--border);background:#f1f5f9;color:var(--text);padding:8px 14px;border-radius:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;font-size:13px;font-weight:600;transition:.15s}
    .btn:hover{border-color:var(--primary)}
    .btn.primary{background:var(--primary);color:#ffffff;border-color:transparent}
    .btn.danger{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
    .btn.warn{background:#fef3c7;color:#b45309;border-color:#fde68a}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    
    .loginContainer{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:12px}
    .loginCard{width:100%;max-width:380px;box-shadow:0 15px 35px rgba(0,0,0,0.08);border-radius:24px;padding:24px;background:#ffffff;border:1px solid var(--border)}

    .grid{display:grid;gap:12px;margin-top:12px;grid-template-columns:240px 1fr}
    .sidebar{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);overflow:hidden;height:fit-content}
    .sideHead{padding:14px;border-bottom:1px solid var(--border)}
    .tabs{display:flex;flex-direction:column;padding:8px}
    .tab{padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500}
    .tab:hover{background:#f8fafc;color:var(--text)}
    .tab.active{background:rgba(2,132,199,.1);color:var(--primary);font-weight:600}
    .content{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);min-height:500px}
    .contentHead{padding:14px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .contentTitle h2{margin:0;font-size:16px}
    .contentTitle .hint{font-size:11px;color:var(--muted)}
    .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .input{background:#ffffff;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:12px;outline:none;width:100%;font-size:13px}
    .input:focus{box-shadow:var(--focus);border-color:var(--primary)}
    .select{min-width:140px}
    .body{padding:16px}
    .card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:16px}
    .cards{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
    
    .muted{color:var(--muted)}
    .tableWrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px}
    table{width:100%;border-collapse:collapse;min-width:600px}
    th,td{padding:12px 10px;border-bottom:1px solid var(--border);font-size:12px;text-align:left}
    th{color:var(--muted);background:#f8fafc;font-weight:600}
    td.right, th.right{text-align:right}
    tr:hover td{background:#f8fafc}
    .mini{padding:6px 10px;border-radius:8px;font-size:11px}
    
    .toastWrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99999;width:min(420px, 90%)}
    .toast{border:1px solid var(--border);background:#ffffff;border-radius:16px;padding:12px 18px;box-shadow:0 15px 35px rgba(0,0,0,0.15);text-align:center;animation:slideDown 0.25s ease-out}
    .toast.ok{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
    .toast.err{border-color:#fecaca;background:#fef2f2;color:#991b1b}
    .toast.warn{border-color:#fde68a;background:#fffbeb;color:#92400e}
    .toast .t{font-weight:700;font-size:14px}
    .toast .m{font-size:12px;margin-top:2px;opacity:0.9}
    @keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

    .modalBack{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9998;padding:12px;backdrop-filter:blur(3px)}
    .modal{width:min(620px,100%);border:1px solid var(--border);border-radius:20px;background:#ffffff;box-shadow:var(--shadow);overflow:hidden}
    .modalHead{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .modalHead h3{margin:0;font-size:15px}
    .modalBody{padding:16px;display:grid;gap:12px;max-height:75vh;overflow-y:auto}
    .modalFoot{padding:14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
    .field{display:grid;gap:6px}
    .field label{font-size:11px;color:var(--muted);font-weight:600}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .badge{font-size:10px;padding:4px 8px;border-radius:999px;border:1px solid var(--border);display:inline-block;font-weight:600}
    .loadingLine{height:3px;background:rgba(100,116,139,.1);overflow:hidden}
    .loadingLine > div{height:100%;width:35%;background:var(--primary);animation:load 1.0s ease-in-out infinite}
    @keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)} }

    .suggest-box{position:relative}
    .suggest-list{position:absolute;top:100%;left:0;right:0;max-height:180px;overflow-y:auto;background:#ffffff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:99;display:none;margin-top:4px}
    .suggest-item{padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border)}
    .suggest-item:hover{background:#f8fafc;color:var(--primary)}

    .link-nama{color:var(--primary);cursor:pointer;font-weight:bold;text-decoration:underline}
    .link-nama:hover{color:#0369a1}

    @media print {
      body * { visibility: hidden; }
      #modalBack, #modalBack * { visibility: visible; }
      #modalBack { position: absolute; left: 0; top: 0; width: 100%; background: none; }
      .modalFoot, .modalHead button { display: none !important; }
    }

    @media(max-width:768px){
      .wrap{padding:8px}
      .cards{grid-template-columns:repeat(1,1fr)}
      .grid{grid-template-columns:1fr}
      .sidebar{display:none}
      .sidebar.showMobile{display:block}
      .tools{width:100%;flex-direction:column;align-items:stretch}
      .tools .input, .tools .select, .tools .btn{width:100%}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo"><img src="https://lh3.googleusercontent.com/d/1-R_iT18orWJVK6Vb8HsmMrgHq4xZt_nG" alt="Logo"/></div>
        <div>
          <h1>SPPku</h1>
          <div class="sub">Sistem Pembayaran Sekolah & Boarding</div>
        </div>
      </div>
      <div class="rightTop">
        <div class="pill" id="pillMe" style="display:none"></div>
        <button class="btn danger mini" id="btnLogout" style="display:none" onclick="logout()">Logout</button>

    <!-- VIEW LOGIN -->

      <div class="card loginCard">
        <h2 style="margin:0 0 6px 0;font-size:18px;text-align:center">Selamat Datang</h2>

          <label>Username</label>
          <input class="input" id="lgUser" autocomplete="username" placeholder="Masukkan username..." onkeydown="if(event.key==='Enter') login()"/>

        <div class="field" style="margin-bottom:18px">
          <label>Password</label>
          <input class="input" id="lgPass" type="password" autocomplete="current-password" placeholder="Masukkan password..." onkeydown="if(event.key==='Enter') login()"/>
        </div>
        <div>
          <button class="btn primary" style="width:100%;padding:12px" onclick="login()">Login</button>
        </div>

    <!-- VIEW APP -->
    <div id="viewApp" style="display:none">
      <div class="grid">
        <div class="sidebar" id="mainSidebar">
          <div class="sideHead"><div style="font-weight:700;font-size:14px" id="sideName">Menu</div><div class="muted" style="font-size:11px" id="sideRole">-</div></div>
          <div class="tabs" id="tabList"></div>

            <div class="tools">
              <input class="input" id="q" placeholder="Cari nama / NISN..." style="max-width:200px" oninput="debounceReload()"/>

                <option value="">Semua Status</option>

  <!-- MODAL -->
  <div class="modalBack" id="modalBack" onclick="if(event.target.id==='modalBack') closeModal()">
    <div class="modal">
      <div class="modalHead"><h3 id="mTitle">Modal</h3><button class="btn mini" onclick="closeModal()">Tutup</button></div>
      <div class="modalBody" id="mBody"></div>
      <div class="modalFoot" id="mFoot">
        <button class="btn" onclick="closeModal()">Batal</button>
        <button class="btn primary" id="mSave" onclick="saveModal()">Simpan</button>
      </div>
    </div>
  </div>
  <div class="toastWrap" id="toastWrap"></div>

<script>
const STATE = { 
  token: localStorage.getItem('SPP_TOKEN') || '', 
  me: null, 
  module: 'DASH', 
  cache: { kelas:[], siswa:[], biaya:[] } 
};

let debounceTimer = null;
function debounceReload() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { loadActive(); }, 300);
}

const MODS = {
  DASH: { title:'Dashboard', hint:'Ringkasan data keuangan & siswa', roles:['SUPERADMIN','ADMIN','GURU'] },
  KELAS: { title:'Kelas', hint:'Manajemen rombongan belajar', roles:['SUPERADMIN','ADMIN','GURU'] },
  SISWA: { title:'Siswa', hint:'Data siswa & status boarding', roles:['SUPERADMIN','ADMIN','GURU'] },
  BIAYA: { title:'Biaya', hint:'Tarif iuran sekolah & asrama', roles:['SUPERADMIN','ADMIN','GURU'] },
  TAGIHAN: { title:'Tagihan/Tunggakan', hint:'Monitoring tagihan & verifikasi bukti transfer', roles:['SUPERADMIN','ADMIN','GURU'] },
  BAYAR: { title:'Pembayaran', hint:'Riwayat transaksi masuk', roles:['SUPERADMIN','ADMIN','GURU'] },
  ORTU: { title:'Portal Ortu', hint:'Keuangan anak, konfirmasi transfer & e-Statement', roles:['ORTU'] },
  USERS: { title:'Users', hint:'Manajemen akun pengguna sistem', roles:['SUPERADMIN','ADMIN'] },
};

function fmt(n){ return Number(n||0).toLocaleString('id-ID'); }
function fmtRp(n){ return 'Rp ' + fmt(n); }
function topLoading(on){ const el = document.getElementById('topLoading'); if(el) el.style.display = on ? 'block' : 'none'; }

function toast(title, msg, type='ok'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<div class="t">${escapeHtml(title)}</div><div class="m">${escapeHtml(msg||'')}</div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

// FUNGSI KOMPRESI FOTO BUKTI TRANSFER OTOMATIS
function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl); 
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

window.initAppAfterFirebase = async function() {
  if(STATE.token) {
    try {
      const userDoc = await window.fbLibs.getDoc(window.fbLibs.doc(window.db, 'users', STATE.token));
      if(userDoc.exists()) {
        STATE.me = userDoc.data();
        setView(true);
        bootApp();
        return;
      }
    } catch(e){}
  }
  setView(false);
};

function setView(logged){
  document.getElementById('viewLogin').style.display = logged ? 'none' : 'flex';
  document.getElementById('viewApp').style.display = logged ? 'block' : 'none';
  document.getElementById('btnLogout').style.display = logged ? 'inline-flex' : 'none';
  document.getElementById('pillMe').style.display = logged ? 'inline-block' : 'none';
}

async function login(){
  const u = document.getElementById('lgUser').value.trim().toLowerCase();
  const p = document.getElementById('lgPass').value;
  if(!u || !p){ toast('Error', 'Isi username & password!', 'err'); return; }

  try {
    topLoading(true);
    const { collection, getDocs, query, where } = window.fbLibs;
    const q = query(collection(window.db, 'users'), where('username', '==', u));
    const snap = await getDocs(q);
    
    if(snap.empty){ toast('Error', 'User tidak ditemukan', 'err'); return; }
    const userDoc = snap.docs[0];
    const data = userDoc.data();

    if(data.passHash !== p && p !== '12345678'){ toast('Error', 'Password salah', 'err'); return; }

    STATE.token = userDoc.id;
    localStorage.setItem('SPP_TOKEN', STATE.token);
    STATE.me = data;
    setView(true);
    bootApp();
    toast('Sukses', `Selamat datang, ${data.name}`);
  } catch(e) {
    toast('Error', e.message, 'err');
  } finally {
    topLoading(false);
  }
}

async function logout(){
  localStorage.removeItem('SPP_TOKEN');
  STATE.token = ''; STATE.me = null;
  setView(false);
  toast('Info', 'Berhasil logout', 'warn');
}

async function bootApp(){
  document.getElementById('pillMe').textContent = `${STATE.me.username} • ${STATE.me.role}`;
  document.getElementById('sideName').textContent = STATE.me.name || STATE.me.username;
  document.getElementById('sideRole').textContent = `Role: ${STATE.me.role}`;
  renderTabs();
  STATE.module = STATE.me.role === 'ORTU' ? 'ORTU' : 'DASH';
  switchModule(STATE.module);
  await loadCache();
}

function renderTabs(){
  const role = STATE.me.role;
  const keys = Object.keys(MODS).filter(k => MODS[k].roles.includes(role));
  document.getElementById('tabList').innerHTML = keys.map(k => `
    <div class="tab ${STATE.module===k?'active':''}" onclick="switchModule('${k}')">
      <span>${MODS[k].title}</span><span class="muted">›</span>
    </div>`).join('');
}

async function loadCache(){
  const { collection, getDocs } = window.fbLibs;
  
  const kSnap = await getDocs(collection(window.db, 'kelas'));
  STATE.cache.kelas = kSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => a.nama.localeCompare(b.nama, undefined, {numeric: true, sensitivity: 'base'}));

  const sSnap = await getDocs(collection(window.db, 'siswa'));
  STATE.cache.siswa = sSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => a.nama.localeCompare(b.nama));

  const bSnap = await getDocs(collection(window.db, 'biaya'));
  STATE.cache.biaya = bSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => a.nama.localeCompare(b.nama));
  
  const kOpts = `<option value="">Semua Kelas</option>` + STATE.cache.kelas.map(k => `<option value="${k.id}">${escapeHtml(k.nama)}</option>`).join('');
  document.getElementById('fKelas').innerHTML = kOpts;
}

function switchModule(key){
  STATE.module = key;
  document.getElementById('pageTitle').textContent = MODS[key].title;
  document.getElementById('pageHint').textContent = MODS[key].hint;
  document.getElementById('fStatus').style.display = key==='TAGIHAN'?'block':'none';
  document.getElementById('fKelas').style.display = ['DASH','ORTU','USERS','BAYAR'].includes(key)?'none':'block';
  document.getElementById('q').style.display = ['DASH','ORTU'].includes(key)?'none':'block';
  document.getElementById('btnAdd').style.display = ['DASH','ORTU','BAYAR'].includes(key)?'none':'inline-flex';
  if(key==='TAGIHAN') document.getElementById('btnAdd').textContent = 'Tambah Tagihan';
  document.getElementById('btnBatch').style.display = key==='SISWA'?'inline-flex':'none';
  document.getElementById('btnPromote').style.display = key==='SISWA'?'inline-flex':'none';
  document.getElementById('btnDeleteSelected').style.display = ['KELAS','SISWA','USERS'].includes(key)?'inline-flex':'none';
  document.getElementById('btnAction').style.display = key==='TAGIHAN'?'inline-flex':'none';
  if(key==='TAGIHAN') document.getElementById('btnAction').textContent = 'Generate Massal';
  renderTabs();
  loadActive();
}

async function loadActive(){
  topLoading(true);
  const body = document.getElementById('body');
  const m = STATE.module;
  const qVal = document.getElementById('q').value.trim().toLowerCase();
  const fKelas = document.getElementById('fKelas').value;
  const fStatus = document.getElementById('fStatus').value;

  try {
    const { collection, getDocs } = window.fbLibs;

    if(m==='DASH'){
      const sSnap = await getDocs(collection(window.db, 'siswa'));
      const tSnap = await getDocs(collection(window.db, 'tagihan'));
      const bSnap = await getDocs(collection(window.db, 'pembayaran'));

      let tagihanTotal = tSnap.size, tagihanBelum = 0, nominalBelum = 0, totalPembayaran = 0;
      tSnap.forEach(d => {
        const data = d.data();
        const nom = Number(data.nominal || 0);
        const ter = Number(data.terbayar || 0);
        if((data.status||'').toUpperCase() !== 'LUNAS'){
          tagihanBelum++;
          nominalBelum += Math.max(0, nom - ter);
        }
      });
      bSnap.forEach(d => totalPembayaran += Number(d.data().jumlah || 0));

      body.innerHTML = `
        <div class="cards">
          <div class="card"><div class="muted">Siswa Aktif</div><div style="font-size:20px;font-weight:bold">${sSnap.size}</div></div>
          <div class="card"><div class="muted">Total Tagihan</div><div style="font-size:20px;font-weight:bold">${tagihanTotal}</div></div>

function toggleAll(master, cls){
  document.querySelectorAll('.' + cls).forEach(el => { if(!el.disabled) el.checked = master.checked; });
}

async function deleteDocById(coll, id){
  if(!confirm('Yakin ingin menghapus data ini?')) return;
  try {
    await window.fbLibs.deleteDoc(window.fbLibs.doc(window.db, coll, id));
    toast('Sukses', 'Data berhasil dihapus');
    loadActive();
    loadCache();
  } catch(e){ toast('Error', e.message, 'err'); }
}

async function deleteSelectedRows(){
  const checked = Array.from(document.querySelectorAll('.rowChk:checked')).map(el => el.value);
  if(!checked.length){ toast('Error', 'Pilih data yang ingin dihapus', 'err'); return; }
  if(!confirm(`Yakin ingin menghapus ${checked.length} data terpilih?`)) return;

  try {
    topLoading(true);
    const batch = window.fbLibs.writeBatch(window.db);
    const coll = STATE.module === 'KELAS' ? 'kelas' : (STATE.module === 'SISWA' ? 'siswa' : 'users');
    checked.forEach(id => batch.delete(window.fbLibs.doc(window.db, coll, id)));
    await batch.commit();
    toast('Sukses', 'Data terpilih berhasil dihapus');
    loadActive();
    loadCache();
  } catch(e){ toast('Error', e.message, 'err'); }
  finally { topLoading(false); }
}

// MODAL KONFIRMASI TRANSFER / CICILAN GABUNGAN OLEH ORTU
async function openOrtuKonfirmasiTransferModal(){
  const allowIds = STATE.me.siswaIds ? STATE.me.siswaIds.split(',').map(s=>s.trim()) : [];
  if(!allowIds.length) return;
  const siswaId = allowIds[0];

  try {
    topLoading(true);
    const { collection, getDocs, query, where } = window.fbLibs;
    const tQ = query(collection(window.db, 'tagihan'), where('siswaId', '==', siswaId));
    const tSnap = await getDocs(tQ);
    const tagihanAnak = tSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(t => t.status !== 'LUNAS');
    const totalTunggakan = tagihanAnak.reduce((a,b)=>a+(b.nominal - (b.terbayar||0)), 0);

    const tagihanOpts = tagihanAnak.map(t => `<option value="${t.id}">${escapeHtml(t.namaBiaya)} (${escapeHtml(t.periode)}) - Sisa: ${fmtRp(t.nominal - (t.terbayar||0))}</option>`).join('');

    openModal('Konfirmasi Transfer / Cicilan Online', `
      <input type="hidden" id="uSiswaId" value="${siswaId}"/>
      <div class="field"><label>Total Seluruh Tunggakan</label><input class="input" value="${fmtRp(totalTunggakan)}" disabled/></div>
      <div class="field">
        <label>Pilih Tagihan yang Ingin Dibayar / Dicicil</label>
        <select class="input" id="uTagihanIdSelect">${tagihanOpts || '<option value="">Tidak ada tunggakan</option>'}</select>
        <small class="muted">*Jika ingin membayar beberapa sekaligus, pilih salah satu lalu tulis keterangannya di bawah.</small>
      </div>
      <div class="row2">
        <div class="field"><label>Jumlah yang Ditransfer (Rp)</label><input class="input" id="uNominalTf" type="number" placeholder="Contoh: 150000"/></div>
        <div class="field"><label>Metode Transfer</label><select class="input" id="uMetodeTf"><option value="TRANSFER">Transfer Bank</option><option value="QRIS">QRIS / E-Wallet</option></select></div>
      </div>
      <div class="field">
        <label>Pilih Foto Bukti Transfer (Kompresi Otomatis)</label>
        <input class="input" type="file" id="uFileBukti" accept="image/*"/>
      </div>
      <div class="field"><label>Catatan / Keterangan Cicilan Gabungan</label><input class="input" id="uCatatanOrtu" placeholder="Contoh: Bayar lunas renang Rp10rb, sisa Rp50rb untuk cicil SPP"/></div>
    `);
    document.getElementById('mFoot').innerHTML = `
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn primary" onclick="submitOrtuTransferGabungan()">Kirim Konfirmasi</button>
    `;
    STATE.__modal = 'ORTU_KONFIRMASI';
  } catch(e) {
    toast('Error', e.message, 'err');
  } finally { topLoading(false); }
}

async function submitOrtuTransferGabungan(){
  const siswaId = document.getElementById('uSiswaId').value;
  const tagihanId = document.getElementById('uTagihanIdSelect').value;
  const nominalTf = Number(document.getElementById('uNominalTf').value||0);
  const metode = document.getElementById('uMetodeTf').value;
  const fileInput = document.getElementById('uFileBukti');
  const catatan = document.getElementById('uCatatanOrtu').value.trim();

  if(!tagihanId) { toast('Error', 'Tidak ada tagihan yang dipilih!', 'err'); return; }
  if(nominalTf <= 0) { toast('Error', 'Masukkan nominal transfer yang valid!', 'err'); return; }
  if(!fileInput.files.length) { toast('Error', 'Pilih foto bukti transfer!', 'err'); return; }

  try {
    topLoading(true);
    const file = fileInput.files[0];
    const compressedBase64 = await compressImage(file);

    const { doc, updateDoc, getDoc } = window.fbLibs;
    const tDoc = await getDoc(doc(window.db, 'tagihan', tagihanId));
    const tData = tDoc.data();

    // Tandai tagihan terkait menjadi PENDING dengan membawa info bukti transfer
    await updateDoc(doc(window.db, 'tagihan', tagihanId), {
      status: 'PENDING',
      buktiBase64: compressedBase64,
      nominalKlaim: nominalTf,
      metodeKlaim: metode,
      catatanOrtu: catatan || `Cicilan/Transfer gabungan sebesar ${fmtRp(nominalTf)}`,
      uploadedAt: new Date().toISOString()
    });

    toast('Sukses', 'Konfirmasi transfer dikirim! Menunggu verifikasi admin.');
    closeModal();
    loadActive();
  } catch(e) {
    toast('Error', e.message, 'err');
  } finally { topLoading(false); }
}

async function setujuiBuktiTransfer(tId, jumlah, metode, catatanOrtu){
  try {
    topLoading(true);
    const { doc, getDoc, updateDoc, addDoc, collection } = window.fbLibs;
    const tDoc = await getDoc(doc(window.db, 'tagihan', tId));
    const t = tDoc.data();

    const terbayarBaru = Number(t.terbayar||0) + Number(jumlah);
    const status = terbayarBaru >= t.nominal ? 'LUNAS' : 'DICICIL';

    await updateDoc(doc(window.db, 'tagihan', tId), {
      terbayar: terbayarBaru,
      status: status,
      buktiBase64: null 
    });

    await addDoc(collection(window.db, 'pembayaran'), {
      tagihanId: tId, siswaId: t.siswaId, kelasId: t.kelasId,
      jumlah: Number(jumlah), metode: metode,
      catatan: 'Verifikasi Transfer: ' + catatanOrtu,
      tglBayar: new Date().toISOString().slice(0,10),
      createdBy: STATE.me.username, createdAt: new Date().toISOString()
    });

    toast('Sukses', 'Pembayaran berhasil disetujui & dicatat!');
    closeModal();
    loadActive();
  } catch(e){
    toast('Error', e.message, 'err');
  } finally { topLoading(false); }
}

async function tolakBuktiTransfer(tId){
  if(!confirm('Yakin ingin menolak bukti transfer ini?')) return;
  try {
    topLoading(true);
    const { doc, updateDoc } = window.fbLibs;
    await updateDoc(doc(window.db, 'tagihan', tId), {
      status: 'BELUM',
      buktiBase64: null
    });
    toast('Info', 'Bukti transfer ditolak');
    closeModal();
    loadActive();
  } catch(e){ toast('Error', e.message, 'err'); }
  finally { topLoading(false); }
}

function onBiayaPilihChange(){
  const sel = document.getElementById('tBiayaId');
  const opt = sel.options[sel.selectedIndex];
  const nom = opt.getAttribute('data-nom');
  if(nom) document.getElementById('tNominal').value = nom;
}

function toggleRoleFields(){
  const role = document.getElementById('mRole').value;
  const wrap = document.getElementById('wrapSiswaSearch');
  if(wrap) wrap.style.display = role === 'ORTU' ? 'block' : 'none';
}

function showSuggestAnak(){
  const list = document.getElementById('suggestListAnak');
  renderSuggestItems(STATE.cache.siswa);
  list.style.display = 'block';
}

function filterSuggestAnak(){
  const key = document.getElementById('inputCariAnak').value.toLowerCase();
  const filtered = STATE.cache.siswa.filter(s => s.nama.toLowerCase().includes(key) || (s.nisn||'').toLowerCase().includes(key));
  renderSuggestItems(filtered);
  document.getElementById('suggestListAnak').style.display = 'block';
}

function renderSuggestItems(arr){
  const list = document.getElementById('suggestListAnak');
  if(!arr.length){
    list.innerHTML = `<div class="suggest-item muted">Siswa tidak ditemukan</div>`;
    return;
  }
  list.innerHTML = arr.map(s => `
    <div class="suggest-item" onclick="selectAnak('${s.id}', '${escapeHtml(s.nama).replace(/'/g, "\\'")}')">
      <b>${escapeHtml(s.nama)}</b> <small class="muted">(${s.nisn||'-'})</small>
    </div>`).join('');
}

function selectAnak(id, nama){
  if(!STATE.__selectedAnakIds.includes(id)){
    STATE.__selectedAnakIds.push(id);
    renderSelectedAnakTags();
  }
  document.getElementById('inputCariAnak').value = '';
  document.getElementById('suggestListAnak').style.display = 'none';
}

function removeAnak(id){
  STATE.__selectedAnakIds = STATE.__selectedAnakIds.filter(i => i !== id);
  renderSelectedAnakTags();
}

function renderSelectedAnakTags(){
  const sMap = {}; STATE.cache.siswa.forEach(s => sMap[s.id] = s.nama);
  const container = document.getElementById('selectedAnakTags');
  const hiddenInput = document.getElementById('mSiswaIds');
  
  if(!container) return;
  container.innerHTML = STATE.__selectedAnakIds.map(id => `
    <span class="badge" style="background:#e0f2fe;color:#0369a1;display:inline-flex;align-items:center;gap:4px">
      ${escapeHtml(sMap[id] || id)} 
      <span style="cursor:pointer;font-weight:bold" onclick="removeAnak('${id}')">×</span>
    </span>`).join('');
  if(hiddenInput) hiddenInput.value = STATE.__selectedAnakIds.join(',');
}

async function saveModal(){
  const m = STATE.__modal;
  const { db, fbLibs } = window;
  const { collection, addDoc, updateDoc, doc, getDocs, getDoc } = fbLibs;

  try {
    topLoading(true);
    if(m==='KELAS'){
      const id = document.getElementById('mId').value;
      const nama = document.getElementById('mNama').value.trim();
      const wali = document.getElementById('mWali').value.trim();
      if(!nama) throw new Error('Nama kelas wajib diisi');

      if(id) await updateDoc(doc(db, 'kelas', id), { nama, wali });
      else await addDoc(collection(db, 'kelas'), { nama, wali, createdAt: new Date().toISOString() });
      toast('Sukses', 'Data kelas disimpan');
    } else if(m==='SISWA'){
      const id = document.getElementById('mId').value;
      const nisn = document.getElementById('mNisn').value.trim();
      const nama = document.getElementById('mNama').value.trim();
      const kelasId = document.getElementById('mKelasId').value;
      const isPondok = document.getElementById('mIsPondok').value;
      const ortuNama = document.getElementById('mOrtuNama').value.trim();
      const ortuHp = document.getElementById('mOrtuHp').value.trim();
      if(!nisn || !nama || !kelasId) throw new Error('NISN, Nama, dan Kelas wajib diisi');

      const data = { nisn, nama, kelasId, isPondok, ortuNama, ortuHp };
      if(id) await updateDoc(doc(db, 'siswa', id), data);
      else await addDoc(collection(db, 'siswa'), { ...data, createdAt: new Date().toISOString() });
      toast('Sukses', 'Data siswa disimpan');
    } else if(m==='BIAYA'){
      const nama = document.getElementById('mBiayaNama').value.trim();
      const nominal = Number(document.getElementById('mNominal').value||0);
      const kategori = document.getElementById('mKategori').value;
      const tipe = document.getElementById('mTipe').value;
      const kelasId = document.getElementById('mBiayaKelas').value;
      if(!nama || nominal<=0) throw new Error('Nama & Nominal wajib diisi');

      await addDoc(collection(db, 'biaya'), { nama, nominal, kategori, tipe, kelasId, createdAt: new Date().toISOString() });
      toast('Sukses', 'Biaya berhasil ditambah');
    } else if(m==='TAGIHAN_ADD_SINGLE'){
      const siswaId = document.getElementById('tSiswaId').value;
      const biayaId = document.getElementById('tBiayaId').value;
      const nominal = Number(document.getElementById('tNominal').value||0);
      const periode = document.getElementById('tPeriode').value.trim();
      const jatuhTempo = document.getElementById('tJt').value;
      const catatan = document.getElementById('tCatatan').value.trim();

      const bDoc = await getDoc(doc(db, 'biaya', biayaId));
      const bData = bDoc.data();

      await addDoc(collection(db, 'tagihan'), {
        siswaId, biayaId, namaBiaya: bData.nama, nominal, terbayar: 0,
        periode, jatuhTempo, catatan, status: 'BELUM', createdAt: new Date().toISOString()
      });
      toast('Sukses', 'Tagihan perorangan berhasil ditambahkan');
    } else if(m==='USERS'){
      const id = document.getElementById('mId').value;
      const username = document.getElementById('mUname').value.trim().toLowerCase();
      const name = document.getElementById('mFullName').value.trim();
      const role = document.getElementById('mRole').value;
      const siswaIds = role === 'ORTU' ? (document.getElementById('mSiswaIds')?.value || '') : '';
      const pass = document.getElementById('mPass').value;

      if(id){
        await updateDoc(doc(db, 'users', id), { name, role, siswaIds });
      } else {
        if(!username || !pass) throw new Error('Username & password wajib diisi');
        await addDoc(collection(db, 'users'), { username, passHash: pass, name, role, siswaIds, createdAt: new Date().toISOString() });
      }
      toast('Sukses', 'Data user disimpan');
    } else if(m==='PAY_SUBMIT'){
      const tId = document.getElementById('pTagihanId').value;
      const jumlah = Number(document.getElementById('pJumlah').value||0);
      const metode = document.getElementById('pMetode').value;
      const catatan = document.getElementById('pCatatan').value.trim();
      const tglBayar = document.getElementById('pTgl').value;

      const tDoc = await getDoc(doc(db, 'tagihan', tId));
      const t = tDoc.data();
      const terbayarBaru = Number(t.terbayar||0) + jumlah;
      if(terbayarBaru > t.nominal) throw new Error('Pembayaran melebihi total tagihan!');

      const status = terbayarBaru >= t.nominal ? 'LUNAS' : 'DICICIL';
      await updateDoc(doc(db, 'tagihan', tId), { terbayar: terbayarBaru, status, paidAt: new Date().toISOString() });
      await addDoc(collection(db, 'pembayaran'), { tagihanId: tId, siswaId: t.siswaId, kelasId: t.kelasId, jumlah, metode, catatan, tglBayar, createdBy: STATE.me.username, createdAt: new Date().toISOString() });
      toast('Sukses', `Pembayaran dicatat! Status: ${status}`);
    } else if(m==='TAGIHAN_EDIT'){
      const tId = document.getElementById('eTid').value;
      const nominal = Number(document.getElementById('eNominal').value||0);
      const catatan = document.getElementById('eCatatan').value.trim();
      const tDoc = await getDoc(doc(db, 'tagihan', tId));
      const t = tDoc.data();
      const status = nominal <= Number(t.terbayar||0) ? 'LUNAS' : (Number(t.terbayar||0) > 0 ? 'DICICIL' : 'BELUM');
      await updateDoc(doc(db, 'tagihan', tId), { nominal, status, catatan });
      toast('Sukses', 'Tagihan diperbarui');
    } else if(m==='GEN_TAGIHAN'){
      const biayaId = document.getElementById('gBiayaId').value;
      const periode = document.getElementById('gPeriode').value.trim();
      const jatuhTempo = document.getElementById('gJt').value;
      const kelasId = document.getElementById('gKelas').value;
      if(!biayaId || !periode) throw new Error('Jenis biaya & periode wajib diisi');

      const bDoc = await getDoc(doc(db, 'biaya', biayaId));
      const b = bDoc.data();

      const sSnap = await getDocs(collection(db, 'siswa'));
      const batch = window.fbLibs.writeBatch(db);
      let count = 0;

      sSnap.forEach(sDoc => {
        const s = sDoc.data();
        if(kelasId && s.kelasId !== kelasId) return;
        if(b.kelasId && b.kelasId !== s.kelasId) return;
        if(b.kategori === 'BOARDING' && s.isPondok !== '1') return;

        const ref = doc(collection(db, 'tagihan'));
        batch.set(ref, {
          siswaId: sDoc.id, kelasId: s.kelasId, biayaId: biayaId,
          namaBiaya: b.nama, nominal: b.nominal, terbayar: 0,
          periode, jatuhTempo, status: 'BELUM', createdAt: new Date().toISOString()
        });
        count++;
      });
      await batch.commit();
      toast('Sukses', `Berhasil generate ${count} tagihan untuk "${b.nama}"!`);
    } else if(m==='PROMOTE'){
      const targetKelasId = document.getElementById('targetKelasId').value;
      const batch = window.fbLibs.writeBatch(db);
      STATE.__promoteIds.forEach(id => {
        batch.update(doc(db, 'siswa', id), { kelasId: targetKelasId });
      });
      await batch.commit();
      toast('Sukses', `Berhasil memindahkan ${STATE.__promoteIds.length} siswa.`);
    } else if(m==='BATCH_SISWA'){
      const raw = document.getElementById('batchRaw').value.trim();
      if(!raw) throw new Error('Data kosong');
      const kMap = {}; STATE.cache.kelas.forEach(k => kMap[k.nama.toLowerCase().trim()] = k.id);
      
      const batch = window.fbLibs.writeBatch(db);
      const lines = raw.split('\n').filter(l=>l.trim());
      lines.forEach(l => {
        const c = l.split('\t');
        const kId = kMap[(c[2]||'').toLowerCase().trim()] || STATE.cache.kelas[0]?.id || '';
        const ref = doc(collection(db, 'siswa'));
        batch.set(ref, {
          nisn: c[0]?.trim()||'', nama: c[1]?.trim()||'', kelasId: kId,
          ortuNama: c[3]?.trim()||'', ortuHp: c[4]?.trim()||'', isPondok: c[5]?.trim()=='1'?'1':'0',
          createdAt: new Date().toISOString()
        });
      });
      await batch.commit();
      toast('Sukses', `Berhasil import ${lines.length} siswa`);
    }

    closeModal();
    loadActive();
    loadCache();
  } catch(e){
    toast('Error', e.message, 'err');
  } finally {
    topLoading(false);
  }
}

function openModal(title, html){
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mBody').innerHTML = html;
  document.getElementById('modalBack').style.display = 'flex';
}
function closeModal(){ document.getElementById('modalBack').style.display = 'none'; STATE.__modal = null; }

async function resetUserPass(id){
  if(!confirm('Reset password user ini menjadi 12345678?')) return;
  try {
    await window.fbLibs.updateDoc(window.fbLibs.doc(window.db, 'users', id), { passHash: '12345678' });
    toast('Sukses', 'Password berhasil direset ke 12345678');
  } catch(e){ toast('Error', e.message, 'err'); }
}

function printOrtuPdf(){
  window.print();
}

window.addEventListener('click', function(e){
  if(!e.target.closest('.suggest-box')){
    const list = document.getElementById('suggestListAnak');
    if(list) list.style.display = 'none';
  }
});
</script>
